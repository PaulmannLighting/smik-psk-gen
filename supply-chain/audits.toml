version = "0.8.48"
notes = "Zero-copy parsing library. Used by ppv-lite86."

[[audits.zerocopy]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.8.48 -> 0.8.57"
notes = "AI-assisted source-diff review. Reviewed pointer, allocation/layout, transmute, trait, and build-script changes. Failed checked transmutes retain original source storage via ReadOnly/ManuallyDrop instead of moving through destination padding; success reads the validated destination once. Ptr iteration consumes the pointer to preserve exclusive aliasing. Trailing-slice limits account for alignment, isize::MAX, and zero-sized elements before unchecked layout construction. Identity and qualified metadata calls support the separately reviewed derives. Build changes add cfg declarations only. Foreign layout cases were statically reviewed; no unexpected I/O or execution."

[[audits.zerocopy-derive]]
who = "Security Audit 2026-04-02"
criteria = "safe-to-deploy"
version = "0.8.48"
notes = "Derive macros for zerocopy."

[[audits.zerocopy-derive]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.8.48 -> 0.8.57"
notes = "AI-assisted source-diff review. Reviewed repr(C) homogeneous generic IntoBytes derivation, emitted bounds, pointer metadata calls, crate-path parsing, and best-effort multi-derive behavior. Homogeneous T/array/trailing-slice fields require identity bounds and reject increased alignment, preserving the no-padding argument and syntax hygiene. Metadata calls are trait-qualified; conditional derives retain their validity bounds. Path parsing rejects invalid forms. No new runtime capabilities or build-time command execution."

