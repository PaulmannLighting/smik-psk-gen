notes = "AI-assisted source-diff review. Reviewed source/manifests/build-script changes, ABI-relevant declaration diffs, and changed helper bodies, separating moved UAPI definitions from behavioral changes. Checked explicit safe/unsafe macro expansion, opaque-type markers, one-byte integer slice casts, ioctl arithmetic, mutex initializer offsets, and time64 layout/link-name cfg separation. Platform additions remain unsafe foreign declarations; helper rewrites largely replace equivalent casts/nulls/initialization. Build probes retain their existing rustc/FreeBSD/Emscripten scope. QURT/QNX and other foreign ABI changes received static review, not exhaustive validation against target headers or execution. No unexpected runtime I/O or new safe raw-pointer dereferences were found."

