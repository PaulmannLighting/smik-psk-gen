[[audits.rand]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.10.0 -> 0.10.2"
notes = "AI-assisted source-diff review of both 0.10.0 -> 0.10.1 and 0.10.1 -> 0.10.2. The first delta removes logging callbacks from ThreadRng reseeding, preventing logger reentrancy into its mutable state, and panics on entropy failure instead of logging and continuing. Checked removal of the log dependency and unchanged reseeding state updates. Reviewed the source and manifest delta. Slice sampling replaces unchecked indexing with checked access, and UniformChar replaces unchecked char construction with validation. Serde sampler range validation is added; malformed state can fail safely rather than produce an invalid char. The helper uses wrapping range arithmetic; shuffle changes are naming/documentation/must_use only. RNG algorithms and entropy acquisition are unchanged. No new unsafe code or capabilities."

