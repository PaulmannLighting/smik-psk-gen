[[audits.blake2]]
who = "Security Audit 2026-04-02"
criteria = "safe-to-deploy"
version = "0.11.0-rc.5"
notes = """
Audited Blake2 cryptographic hash function from RustCrypto.
Used internally by Argon2. Unsafe code for SIMD optimizations.
"""

[[audits.blake2]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.11.0-rc.5 -> 0.11.0"
notes = "AI-assisted source-diff review. Reviewed removal of the unused SIMD implementations and generic AsBytes trait, scalar vector operations, endian conversion, and output assembly. The remaining raw byte view covers a repr(C) vector of four homogeneous u32/u64 fields without padding and borrows for the source lifetime. Native rotations, wrapping additions, permutations, and copying the two output halves preserve the scalar algorithm. No added I/O or build execution."

[[audits.block-buffer]]
who = "Security Audit 2026-04-02"
criteria = "safe-to-deploy"
version = "0.12.0"
notes = "Block buffer utilities from RustCrypto."

[[audits.block-buffer]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.12.0 -> 0.12.1"
notes = "AI-assisted source-diff review. Reviewed panic-safety changes to eager buffering, padding, and ReadBuffer::write_block. Reset guards restore the encoded position when callbacks unwind after buffer writes. Padding checks and pointer offsets remain within a block; the read-buffer guard is forgotten only immediately before the validated position update. Reviewed catch_unwind regressions and manifest changes. No new external capabilities."

[[audits.chacha20]]
who = "Security Audit 2026-04-02"
criteria = "safe-to-deploy"
version = "0.10.0"
notes = """
Audited ChaCha20 stream cipher from RustCrypto.
Industry-standard cipher, unsafe code for SIMD optimizations.
"""

[[audits.chacha20]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.10.0 -> 0.10.2"
notes = "AI-assisted source-diff review. Reviewed SSE2 state load/store changes, NEON batching, constants, manifests, and regression tests. SSE2 removes an instruction requiring SSE4.1 and stores the final four words within the 16-word state. NEON cipher batching grows to eight blocks with matching counter lanes and bounded 64-byte output stores; the separate four-block RNG path remains consistent. Round operations and nonce/counter layout are preserved. Architecture-specific code was reviewed statically; no new I/O."

