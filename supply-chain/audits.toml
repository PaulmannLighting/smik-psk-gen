[[audits.argon2]]
who = "Security Audit 2026-04-02"
criteria = "safe-to-deploy"
version = "0.6.0-rc.8"
notes = """
Audited Argon2 password hashing implementation from RustCrypto.
Industry-standard algorithm with memory-hard design. Unsafe code used for
memory management and SIMD optimizations, all well-documented.
"""

[[audits.argon2]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.6.0-rc.8 -> 0.6.0"
notes = "AI-assisted source-diff review. Reviewed the release-candidate-to-release source and manifest diff. Hashing, memory filling, and parallel execution are unchanged; changes are documentation/lints, equivalent method syntax, the stable blake2 dependency, and a regression test for non-default output length. No new unsafe code or external side effects."

[[audits.base64]]
who = "AI-assisted review (OpenAI Codex)"
criteria = "safe-to-deploy"
delta = "0.22.1 -> 0.23.1"
notes = "AI-assisted source-diff review. Reviewed custom padding-symbol validation and propagation through scalar, reader, writer, and chunked encoders, plus the complete new SIMD module. SIMD is a default feature, but existing general-purpose presets remain scalar. Checked sealed alphabet tables, CPU detection in safe constructors, vector load/store bounds, scalar tail/error handling, and AVX2/NEON lane layouts. A temporary release-mode host probe passed scalar/SIMD comparisons for standard/URL alphabets, padded/unpadded lengths 0..1024, output offsets 0..31 with exact buffers and sentinels, and all byte values at ten malformed-input boundaries. Foreign-target SIMD was inspected statically, not executed. No ambient I/O beyond caller-provided streams."

[[audits.base64ct]]
who = "Security Audit 2026-04-02"
criteria = "safe-to-deploy"
version = "1.8.3"
notes = "Constant-time base64 encoding from RustCrypto."

